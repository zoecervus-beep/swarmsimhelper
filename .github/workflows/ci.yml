# This doesn't deploy anything. GitHub Pages deploys from .github/workflows/pages.yml.

name: continuous integration

on:
  push:
    branches: [ "master", "production" ]
  pull_request:
    branches: [ "master", "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PhantomJS 2.1.1 (Karma's browser) aborts on reading a modern openssl.cnf
      # ("Auto configuration failed ... libproviders.so"); the Dockerfile does the same.
      OPENSSL_CONF: /dev/null
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: "16.x"
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
    - run: gem install compass
    - run: yarn --frozen-lockfile
    - run: yarn test
